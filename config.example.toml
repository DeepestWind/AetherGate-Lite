[app]
name = "AetherGate-Lite"
env = "development"
host = "0.0.0.0"
port = 8000
log_level = "INFO"
log_dir = "data/logs"
database_url = "sqlite:///./data/aethergate-lite.db"
auth_token = "change-me"
master_key = "change-this-master-key"
cache_ttl_seconds = 300
cache_temperature_threshold = 0.3
request_timeout_seconds = 60
timezone = "Asia/Shanghai"

